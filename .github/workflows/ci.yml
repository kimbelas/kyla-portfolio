name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run check
      - run: npm test

      - name: Build
        run: npm run build
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://kyla-belas.pages.dev/' }}

      # Lighthouse runs right after the production build: the e2e web server
      # below rebuilds dist with test values, so it must come last.
      - name: Lighthouse budgets
        run: npx @lhci/cli autorun

      - run: npx playwright install --with-deps
      - run: npm run test:e2e
